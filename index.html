<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dashboard Index</title>
    <style>
        :root {
            --primary: #0366d6;
            --highlight: #ff0000;
            --muted: #f5f5f5;
            --nav-height: 64px;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
            overflow: hidden;
        }

        .container {
            /* max-width:1200px; */
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        header.navbar {
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--muted);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 18px;
            margin: 0;
        }

        nav ul {
            display: flex;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        nav a {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 6px;
            background: transparent;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            background: #fff;
        }

        nav a.active {
            background: var(--primary);
            color: #fff
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .zoom-controls button {
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--primary);
        }

        .zoom-controls button:active {
            transform: translateY(1px)
        }

        .zoom-controls input[type=range] {
            width: 120px;
            accent-color: var(--highlight);
            &:-moz-window-inactive {
                --thumb-color: var(--highlight);
            }
        }

        

        .zoom-controls .zoom-label {
            min-width: 48px;
            text-align: right;
            font-size: 13px
        }

        .content {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
        }

        .links-container {
            display: none;
            /* keep original list hidden as fallback */
        }

        iframe#kpi-frame {
            width: 100%;
            height: calc(100vh - var(--nav-height) - 24px);
            border: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            border-radius: 6px;
        }

        @media (max-width:640px) {
            nav ul {
                overflow: auto
            }

            iframe#kpi-frame {
                height: calc(100vh - var(--nav-height) - 16px)
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="navbar">
            <h1>KPI Dashboard</h1>
            <nav aria-label="KPI Navigation">
                <ul id="nav-list">
                    <li><a href="#" data-href="Dry Mat_kpi.html">Dry Mat</a></li>
                    <li><a href="#" data-href="Coater Application_kpi.html">Coater</a></li>
                    <li><a href="#" data-href="Granule Application_kpi.html">Granule Application</a></li>
                    <li><a href="#" data-href="Cooling Section_kpi.html">Cooling Section</a></li>
                    <li><a href="#" data-href="FPL_kpi.html">FPL</a></li>
                    <li><a href="#" data-href="Sealant & Laminate Mixing_kpi.html">Sealant & Laminate Mixing</a></li>
                    <li><a href="#" data-href="Laminate Section_kpi.html">Laminate</a></li>
                    <li><a href="#" data-href="3 Tab Section_kpi.html">3 Tab</a></li>
                    <li><a href="#" data-href="Packaging Section_kpi.html">Packaging</a></li>
                    <li><a href="#" data-href="Aux Systems_kpi.html">Aux Systems</a></li>
                </ul>
            </nav>

            <div class="zoom-controls" aria-hidden="false">
                <button id="zoom-minus" title="Zoom out">−</button>
                <input id="zoom-range" type="range" min="50" max="200" value="100" step="5" aria-label="Zoom percent">
                <button id="zoom-plus" title="Zoom in">+</button>
                <div class="zoom-label" id="zoom-label">100%</div>
            </div>
        </header>

        <main class="content">
            <!-- iframe that loads KPI pages, wrapped so we can control overflow -->
            <div class="iframe-wrap" style="flex:1 1 auto; overflow:auto;">
                <iframe id="kpi-frame" title="KPI viewer" src="Dry Mat_kpi.html"></iframe>
            </div>
        </main>
    </div>

    <script>
        (function () {
            const nav = document.getElementById('nav-list');
            const frame = document.getElementById('kpi-frame');
            function setActive(link) {
                Array.from(nav.querySelectorAll('a')).forEach(a => a.classList.remove('active'));
                if (link) link.classList.add('active');
            }

            nav.addEventListener('click', function (e) {
                const a = e.target.closest('a[data-href]');
                if (!a) return;
                e.preventDefault();
                const href = a.getAttribute('data-href');
                if (href) {
                    frame.src = href;
                    setActive(a);
                    // update history so back button works within the index page
                    try { history.pushState({ kpi: href }, '', '#' + encodeURIComponent(href)); } catch (e) { }
                }
            });

            // On load, check hash to restore last viewed page
            window.addEventListener('load', function () {
                const hash = location.hash && decodeURIComponent(location.hash.slice(1));
                if (hash) {
                    const link = nav.querySelector('[data-href="' + hash + '"]');
                    if (link) { frame.src = hash; setActive(link); }
                } else {
                    // mark the default active link
                    const first = nav.querySelector('a[data-href]');
                    if (first) setActive(first);
                }
            });

            // support back/forward navigation
            window.addEventListener('popstate', function (e) {
                const href = (e.state && e.state.kpi) || (location.hash && decodeURIComponent(location.hash.slice(1)));
                if (href) {
                    frame.src = href;
                    const link = nav.querySelector('[data-href="' + href + '"]');
                    if (link) setActive(link);
                }
            });

            // -------------------------
            // Zoom controls for iframe
            // -------------------------
            const zoomRange = document.getElementById('zoom-range');
            const zoomMinus = document.getElementById('zoom-minus');
            const zoomPlus = document.getElementById('zoom-plus');
            const zoomLabel = document.getElementById('zoom-label');
            const iframeWrap = document.querySelector('.iframe-wrap');

            let zoom = parseInt(zoomRange.value, 10) || 100;
            function applyZoom(val) {
                zoom = Math.max(10, Math.min(300, Math.round(val)));
                const scale = zoom / 100;
                // scale the iframe content and adjust the iframe width/height so it fits the wrapper
                frame.style.transform = 'scale(' + scale + ')';
                frame.style.transformOrigin = '0 0';
                // Make the iframe element larger so the scaled content fills the container width
                frame.style.width = (100 / scale) + '%';
                // compute height so the visible area stays consistent
                const navHeight = document.querySelector('header.navbar').offsetHeight || 64;
                const extra = 24; // padding used in CSS calculations
                const visibleH = window.innerHeight - navHeight - extra;
                // set iframe height to compensate for scaling
                frame.style.height = (visibleH / scale) + 'px';
                // update UI
                zoomRange.value = zoom;
                zoomLabel.textContent = zoom + '%';
            }

            zoomMinus.addEventListener('click', function () { applyZoom(zoom - 10); });
            zoomPlus.addEventListener('click', function () { applyZoom(zoom + 10); });
            zoomRange.addEventListener('input', function () { applyZoom(parseInt(this.value, 10)); });
            window.addEventListener('resize', function () { applyZoom(zoom); });
            // initialize
            applyZoom(zoom);
        })();
    </script>
</body>

</html>
